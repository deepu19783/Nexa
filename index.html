
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101014">
  <title>Nexa AI — Your AI Assistant</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand-row">
        <a class="brand" href="index.html"><img src="assets/nexa-logo.jpg" alt="Nexa AI Logo" class="brand-mark"> Nexa AI</a>
        <button class="icon-button mobile-only" id="closeSidebar" aria-label="Close sidebar">✕</button>
      </div>

      <button class="new-chat-button" id="newChatButton">＋ New chat</button>

      <div class="sidebar-label">YOUR CHATS</div>
      <div class="history-list" id="historyList">
        <p class="muted small">Sign in to save your chats.</p>
      </div>

      <div class="sidebar-bottom">
        <button class="sidebar-action" id="themeButton">☾ <span>Switch theme</span></button>
        <a class="sidebar-action" href="login.html" id="accountLink">↗ <span>Login / Sign up</span></a>
        <div class="account-row hidden" id="accountRow">
          <div class="account-avatar" id="accountAvatar" aria-hidden="true">N</div>
          <div class="account-details">
            <span class="account-name" id="accountName"></span>
            <span class="account-email" id="accountEmail"></span>
          </div>
          <button class="sidebar-action account-logout" id="logoutButton" aria-label="Log out" title="Log out">⇥</button>
        </div>
      </div>
    </aside>

    <div class="mobile-overlay" id="mobileOverlay"></div>

    <main class="main">
      <header class="topbar">
        <button class="icon-button mobile-only" id="openSidebar" aria-label="Open sidebar">☰</button>
        <div class="topbar-title">Nexa AI <span class="status-dot"></span></div>
        <a href="login.html" class="topbar-account" id="topAccountLink">Sign in</a>
      </header>

      <section class="chat-area" id="chatArea">
        <div class="welcome" id="welcome">
          <img src="assets/nexa-logo.jpg" alt="Nexa AI Logo" class="welcome-logo">
          <p class="eyebrow">YOUR AI ASSISTANT</p>
          <h1>What can I help you with?</h1>
          <p class="welcome-subtitle">Ask questions, learn something new, or build your next idea.</p>

          <div class="suggestions">
            <button class="suggestion" data-prompt="Teach me Python file handling with examples.">
              <span>⌘</span><strong>Learn coding</strong><small>Explain a topic step by step</small>
            </button>
            <button class="suggestion" data-prompt="Help me make a realistic study plan for this week.">
              <span>▤</span><strong>Make a study plan</strong><small>Organize tasks and goals</small>
            </button>
            <button class="suggestion" data-prompt="Suggest a simple online business I can start on a low budget.">
              <span>↗</span><strong>Explore ideas</strong><small>Turn an idea into a plan</small>
            </button>
            <button class="suggestion" data-prompt="Explain how websites work, from HTML to hosting.">
              <span>⌘</span><strong>Understand technology</strong><small>Break down complex concepts</small>
            </button>
          </div>
        </div>

        <div class="messages hidden" id="messages" aria-live="polite"></div>
      </section>

      <footer class="composer-wrap">
        <form class="composer" id="chatForm">
          <textarea id="messageInput" rows="1" placeholder="Message Nexa AI..." aria-label="Message Nexa AI"></textarea>
          <div class="composer-tools">
            <div class="composer-left">
              <button class="tool-button" id="voiceButton" type="button" title="Voice input">🎙 <span>Voice</span></button>
              <label class="tool-button file-button" for="fileInput" title="Attach a text file">＋ <span>Attach</span></label>
              <input id="fileInput" type="file" accept=".txt,.md,.csv,.json,.html,.css,.js,.py,.pdf" hidden>
            </div>
            <button class="send-button" id="sendButton" type="submit" aria-label="Send message">↑</button>
          </div>
        </form>
        <p class="disclaimer" id="composerStatus">Nexa AI can make mistakes. Check important information.</p>
      </footer>
    </main>
  </div>

  <div class="toast" id="toast" role="status"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
