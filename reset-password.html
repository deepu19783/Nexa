
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset password — Nexa AI</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <a class="brand auth-brand" href="index.html"><img src="assets/nexa-logo.jpg" alt="Nexa AI Logo" class="brand-mark"> Nexa AI</a>
    <h1 class="auth-heading" id="resetHeading">Reset password</h1>
    <p class="auth-description" id="resetDescription">Enter your account email and we'll send a reset link.</p>

    <form class="auth-form" id="resetForm">
      <label id="emailLabel">Email address
        <input id="email" type="email" autocomplete="email" required>
      </label>
      <label class="hidden" id="newPasswordLabel">New password
        <input id="newPassword" type="password" autocomplete="new-password" minlength="8">
      </label>
      <button class="auth-submit" type="submit" id="resetSubmit">Send reset link</button>
      <p class="auth-message" id="authMessage" aria-live="polite"></p>
    </form>

    <nav class="auth-links"><a href="login.html">Back to login</a></nav>
    <a class="auth-back" href="index.html">← Back to chat</a>
  </main>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
